; Минимальные настройки кассы UAMenu для стенда. Это не полный cantina.ini -
; у боевого файла около 300 ключей (разбор - docs/cantina-ini.md в приватном
; репозитории). Здесь только то, без чего стенд не заработает, плюс то, что
; на стенде должно отличаться от магазина.
;
; Ключи с секретами - только пометками @secret:; значения кладутся в реестр
; пользователя Windows: python -m pypos secrets migrate cantina.ini --yes
;
; Многие ключи касса читает СНАЧАЛА из базы (TMS_INIT_PARAMS), потом из
; файла - в частности FiscalPrinter. Если касса ведёт себя не по файлу,
; смотреть параметр в базе.

[General]
; --- база -------------------------------------------------------------
Server=<TNS-имя из tnsnames.ora>
Schema=<схема фронта>
PosID=101

; --- фискальный принтер: виртуальный, печатает в файл и в окно ----------
FiscalPrinter=VirtualFP
VirtualFPWindowWidth=520
VirtualFPCloseAfterSec=30
VirtualFPLineDelayMs=180
VirtualFPShotAtLine=6
AllowActivateVirtualFP=true

; --- витрины бэк-офиса --------------------------------------------------
; true  - при старте касса зовёт unirest_mv_v.refersh_mv (нужен DB link)
; false - на клоне без бэк-офиса; витрины статичны
RefreshUnirest=false

; --- лицензирование License26 (необязательно) ---------------------------
; Пусто - 30 дней ознакомительного периода, касса работает без службы
License26Server=
License26Key=
License26Site=

; --- ключи внешних служб: только пометки ---------------------------------
PosApiKey=@secret:cantina.ini/General/PosApiKey
MIAClientSecret=@secret:cantina.ini/General/MIAClientSecret
MIAApiKey=@secret:cantina.ini/General/MIAApiKey
MIAApiSecrect=@secret:cantina.ini/General/MIAApiSecrect
licenseKey=@secret:cantina.ini/General/licenseKey

; --- лояльность на стенде: без сети -------------------------------------
PosApiSimulate=1
