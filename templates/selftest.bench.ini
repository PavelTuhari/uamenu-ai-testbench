; Сценарий самотеста кассы UAMenu для стенда. Положить рядом с UAMenu.exe
; под именем selftest.ini. Файл в кодировке CP1251 либо UTF-8 с BOM.
;
; Пароли здесь не пишутся: пометки @secret: разрешает касса из реестра
; пользователя Windows. Положить значения:
;   python -m pypos secrets migrate selftest.ini --yes   (если пароли были в файле)
;   либо  python -m pypos secrets set selftest.ini/Login/Password --file p.txt
;
; Контрольные данные (товары, карта, купон) - из тестовой схемы владельца;
; на другой схеме заменить на существующие (проверить select заранее).

[Login]
User=Tolik
Password=@secret:selftest.ini/Login/Password
Schema=<схема фронта>
SchemaPassword=@secret:selftest.ini/Login/SchemaPassword
Server=<TNS-имя>

[Test]
OutDir=SelfTest
Screenshots=1
StepDelay=900
KeepOpenCheck=0
CloseAfter=1
License=0

